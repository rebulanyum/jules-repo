<div class="toolbar-container">
  <!-- Display Mode: mat-select -->
  @if (mode === 'display') {
    <div class="control-section">
      <mat-form-field class="toolbar-form-field">
        <mat-label>Select Filter</mat-label>
        <mat-select [value]="selectedKey" (selectionChange)="onSelectionChange($event.value)">
          @for (key of filterKeys; track key) {
            <mat-option [value]="key">
              {{ key }}
            </mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>
  }

  <!-- Edit Mode: Text Input -->
  @if (mode === 'edit') {
    <div class="control-section">
      <mat-form-field class="toolbar-form-field">
        <mat-label>Filter Name</mat-label>
        <input matInput [formControl]="filterNameControl" placeholder="Enter new name" (keyup.enter)="saveEdit()" />
        @if (filterNameControl.hasError('duplicate')) {
          <mat-error>
            Name must be unique (case-insensitive)
          </mat-error>
        }
        @if (filterNameControl.hasError('required')) {
          <mat-error>
            Filter name is required
          </mat-error>
        }
      </mat-form-field>
    </div>
  }

  <!-- Action Buttons -->
  <div class="buttons-section">
    <!-- Add Button -->
    <button mat-icon-button color="primary"
            matTooltip="Add New Filter"
            [disabled]="mode === 'edit'"
            (click)="enableAddMode()">
      <mat-icon>add</mat-icon>
    </button>

    <!-- Copy Button -->
    <button mat-icon-button color="primary"
            matTooltip="Copy Selected Filter"
            [disabled]="mode === 'edit' || !selectedKey"
            (click)="enableCopyMode()">
      <mat-icon>content_copy</mat-icon>
    </button>

    <!-- Rename Button -->
    <button mat-icon-button color="primary"
            matTooltip="Rename Selected Filter"
            [disabled]="mode === 'edit' || !selectedKey || filterKeys.length === 0"
            (click)="enableEditMode()">
      <mat-icon>edit</mat-icon>
    </button>

    <!-- Save Button -->
    <button mat-icon-button color="accent"
            matTooltip="Save Changes"
            [disabled]="mode === 'display' || filterNameControl.invalid"
            (click)="saveEdit()">
      <mat-icon>save</mat-icon>
    </button>

    <!-- Cancel Button -->
    <button mat-icon-button color="warn"
            matTooltip="Cancel Editing"
            [disabled]="mode === 'display' || filterKeys.length === 0"
            (click)="cancelEdit()">
      <mat-icon>cancel</mat-icon>
    </button>

    <!-- Delete Button -->
    <button mat-icon-button color="warn"
            matTooltip="Delete Selected Filter"
            [disabled]="mode === 'edit' || !selectedKey || filterKeys.length === 0"
            (click)="onDeleteClick()">
      <mat-icon>delete</mat-icon>
    </button>
  </div>
</div>
