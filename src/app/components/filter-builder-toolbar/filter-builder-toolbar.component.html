<div class="toolbar-container">
  <!-- Display Mode: dx-select-box -->
  @if (mode === 'display') {
    <div class="control-section">
      <dx-select-box
        class="toolbar-select-box"
        [items]="filterKeys"
        [value]="selectedKey"
        placeholder="Select Filter"
        (onValueChanged)="onSelectionChange($event.value)">
      </dx-select-box>
    </div>
  }

  <!-- Edit Mode: dx-select-box with acceptCustomValue -->
  @if (mode === 'edit') {
    <div class="control-section">
      <dx-select-box
        #editSelectBox
        class="toolbar-select-box"
        [items]="filterKeys"
        [value]="selectedKey"
        placeholder="Filter Name"
        [acceptCustomValue]="true"
        customItemCreateEvent="focusout"
        (onCustomItemCreating)="onCustomItemCreating($event)"
        (onValueChanged)="onSelectionChange($event.value)"
        (onInput)="onInput($event)">
      </dx-select-box>
      @if (isInvalid && errorMessage) {
        <div class="validation-error-message">
          {{ errorMessage }}
        </div>
      }
    </div>
  }

  <!-- Action Buttons -->
  <div class="buttons-section">
    <!-- Add Button -->
    <button mat-icon-button color="primary"
            matTooltip="Add New Filter"
            [disabled]="mode === 'edit'"
            (click)="enableAddMode()">
      <mat-icon>add</mat-icon>
    </button>

    <!-- Copy Button -->
    <button mat-icon-button color="primary"
            matTooltip="Copy Selected Filter"
            [disabled]="mode === 'edit' || !selectedKey"
            (click)="enableCopyMode()">
      <mat-icon>content_copy</mat-icon>
    </button>

    <!-- Rename Button -->
    <button mat-icon-button color="primary"
            matTooltip="Rename Selected Filter"
            [disabled]="mode === 'edit' || !selectedKey || filterKeys.length === 0"
            (click)="enableEditMode()">
      <mat-icon>edit</mat-icon>
    </button>

    <!-- Save Button -->
    <button mat-icon-button color="accent"
            matTooltip="Save Changes"
            [disabled]="mode === 'display' || isInvalid"
            (click)="saveEdit()">
      <mat-icon>save</mat-icon>
    </button>

    <!-- Cancel Button -->
    <button mat-icon-button color="warn"
            matTooltip="Cancel Editing"
            [disabled]="mode === 'display' || filterKeys.length === 0"
            (click)="onCancelClick()">
      <mat-icon>cancel</mat-icon>
    </button>

    <!-- Delete Button -->
    <button mat-icon-button color="warn"
            matTooltip="Delete Selected Filter"
            [disabled]="mode === 'edit' || !selectedKey || filterKeys.length === 0"
            (click)="onDeleteClick()">
      <mat-icon>delete</mat-icon>
    </button>
  </div>
</div>
